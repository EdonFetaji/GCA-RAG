[project]
name = "gca-rag"
version = "0.1.0"
description = "Graph-Consistency-Aware RAG — agentic KG extraction with a learned GNN consistency validator."
requires-python = ">=3.12"

# Top-level dependencies only. Transitive pins live in uv.lock, which is the
# single source of truth for the whole project (pipeline + MCP servers).
# Manage with `uv add` / `uv remove`; never hand-edit the lock.
dependencies = [
    # ── Agentic pipeline ──────────────────────────────────────────────
    "langgraph>=0.2.60",
    "langchain-core>=0.3.30",
    "langchain-cerebras>=0.5.0",
    # Not for OpenAI: ChatOpenAI is the client for any OpenAI-compatible
    # endpoint, which is how the `meta` provider reaches Meta Model API.
    "langchain-openai>=1.5.1",
    "mcp>=1.2.0",
    "jinja2>=3.1.6",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    # ── Dataset / graph handling ──────────────────────────────────────
    "datasets==3.5.0",
    "networkx>=3.2",
    # ── Track 3 validator (GNN) ───────────────────────────────────────
    "torch>=2.2",
    "torch-geometric>=2.5",
    # ── Track 5 evaluation ────────────────────────────────────────────
    "rouge-score>=0.1.2",
    "nltk>=3.8",
    # ── Legacy poc/extraction FastAPI service ─────────────────────────
    "cerebras-cloud-sdk>=1.91",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "fastmcp>=3.4.7",
    "langchain-groq>=1.1.3",
    "langchain-google-genai>=4.3.4",
    # ChatNVIDIA rather than ChatOpenAI at NVIDIA's compatible base: it knows
    # NIM's nvext guided decoding and the chat-template thinking toggle.
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "h5py>=3.16.0",
    # ChatMistralAI rather than ChatOpenAI at Mistral's base: the parameter is
    # `endpoint`, not `base_url`, and its json_schema mode converts with strict=True.
    "langchain-mistralai>=1.1.6",
    # Optional at runtime: only imported when KG_GCS_BUCKET is set. Kept a hard
    # dependency anyway so `uv sync` gives everyone the same lock.
    "google-cloud-storage>=3.13.1",
    "huggingface-hub<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
    "grandalf>=0.8",  # graph.get_graph().draw_ascii()
    "langgraph-cli[inmem]>=0.4.31",
]

# ── PyTorch: CPU-only build ───────────────────────────────────────────
# torch is here for the Track 3 GNN validator, which does not need CUDA. The
# default Linux wheel pulls the full nvidia/* + triton stack — ~4.5 GB in the
# venv and ~5 GB more in the uv cache — on machines that have no GPU (the
# extraction box is a c4-highcpu-8). Pinning the CPU index installs the small
# build instead. Remove this block and re-lock if the validator ever trains on
# a GPU.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kg_agentic_extraction", "mcp_server", "utils", "validator", "extractor_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# `live` tests hit dbpedia.org for real. Deselected by default so the suite is
# offline and deterministic; run them with `pytest -m live` when changing a
# SPARQL query, since a stubbed transport cannot tell you the query is valid.
addopts = "-m 'not live'"
markers = ["live: hits the real DBpedia endpoints; deselected by default"]

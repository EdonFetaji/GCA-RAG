[project]
name = "gca-rag"
version = "0.1.0"
description = "Graph-Consistency-Aware RAG — agentic KG extraction with a learned GNN consistency validator."
requires-python = ">=3.12"

# Top-level dependencies only. Transitive pins live in uv.lock, which is the
# single source of truth for the whole project (pipeline + MCP servers).
# Manage with `uv add` / `uv remove`; never hand-edit the lock.
dependencies = [
    # ── Agentic pipeline ──────────────────────────────────────────────
    "langgraph>=0.2.60",
    "langchain-core>=0.3.30",
    "langchain-cerebras>=0.5.0",
    "mcp>=1.2.0",
    "jinja2>=3.1.6",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    # ── Dataset / graph handling ──────────────────────────────────────
    "datasets>=2.19",
    "networkx>=3.2",
    # ── Track 3 validator (GNN) ───────────────────────────────────────
    "torch>=2.2",
    "torch-geometric>=2.5",
    # ── Track 5 evaluation ────────────────────────────────────────────
    "rouge-score>=0.1.2",
    "nltk>=3.8",
    # ── Legacy poc/extraction FastAPI service ─────────────────────────
    "cerebras-cloud-sdk>=1.91",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "fastmcp>=3.4.7",
    "langchain-groq>=1.1.3",
    "langchain-google-genai>=4.3.4",
    "h5py>=3.16.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
    "grandalf>=0.8",  # graph.get_graph().draw_ascii()
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kg_agentic_extraction", "mcp_server", "utils", "validator", "extractor_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
